# Standalone deployment. Self-contained: copy this one file anywhere and run
#
#   docker compose up -d
#
# No .env, no Caddyfile, no source tree. Every value has a default and every
# image is pinned by name, so nothing is built locally.
#
# Publishes two ports for an external reverse proxy to sit in front of:
#
#   ${WEB_PORT}  the Flutter web app
#   ${API_PORT}  the Django API and admin
#
# Postgres is never published; it is reachable only on the internal network.
#
# ---------------------------------------------------------------------------
# PROXY: map both onto ONE hostname, or the browser will refuse the API calls.
#
#   /       ->  127.0.0.1:8080     (web)
#   /api    ->  127.0.0.1:8000     (api)
#   /admin  ->  127.0.0.1:8000     (api)
#   /static ->  127.0.0.1:8000     (api)
#
# Same origin means no CORS to configure and no rebuild: the web bundle calls
# the API at the relative path /api/v1. Serving them from two different
# hostnames works too, but then set the API address by hand in the app's
# Settings screen.
#
# Your proxy must NOT strip Cross-Origin-Opener-Policy or
# Cross-Origin-Embedder-Policy. They are set below, and they are load-bearing:
# without them the browser drops the app from durable OPFS storage to evictable
# IndexedDB, silently, and offline data stops surviving a refresh.
# ---------------------------------------------------------------------------

name: calyx

x-postgres: &postgres
  POSTGRES_DB: ${POSTGRES_DB:-tasks}
  POSTGRES_USER: ${POSTGRES_USER:-tasks}
  # Only reachable from inside the compose network -- the db publishes no port.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks}

x-django: &django
  <<: *postgres
  POSTGRES_HOST: db
  DJANGO_DEBUG: "false"
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  # Behind a trusted proxy. Narrow this if the API is ever reachable directly.
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  # Needed to log into /admin/ through the proxy, e.g.
  # https://tasks.example.ts.net
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-false}
  # Only when the web app is served from a DIFFERENT origin than this API.
  # Full origins with scheme, comma separated:
  #   CORS_ALLOWED_ORIGINS=https://calyx.example.ts.net
  # Empty is correct when both are behind one hostname.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # Unset on purpose: the API generates a key on first boot and persists it in
  # the apistate volume, so this file carries no published secret.
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: *postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs to completion before the API starts, so a new image can never boot
  # against an old schema.
  migrate:
    image: ghcr.io/hamza-raed-kh/calyx-api:main
    restart: "no"
    environment: *django
    volumes:
      - apistate:/app/state
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--noinput"]

  api:
    image: ghcr.io/hamza-raed-kh/calyx-api:main
    restart: unless-stopped
    environment: *django
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - media:/app/media
      - apistate:/app/state
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/',
          timeout=5).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Copies the built bundle into a volume and exits. Staged then swapped via a
  # relative symlink, so an interrupted copy cannot leave a half-written bundle
  # being served, and the link resolves under whichever path each container
  # mounts the volume at.
  web-bundle:
    image: ghcr.io/hamza-raed-kh/calyx-web:main
    restart: "no"
    volumes:
      - web_bundle:/out
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        NAME=".staging-$$(date -u +%Y%m%d%H%M%S)"
        mkdir -p "/out/$$NAME"
        cp -r /dist/. "/out/$$NAME/"
        ln -sfn "$$NAME" /out/.current.tmp
        mv -Tf /out/.current.tmp /out/current
        ls -1d /out/.staging-* | head -n -2 | xargs -r rm -rf
        echo "web bundle published: $$NAME"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # Where the app should call the API. Served to the browser at runtime, so
      # one published image works for any hostname with no rebuild.
      #
      # Leave as /api/v1 when the API is behind the same hostname as this app.
      # Set the absolute URL when they are on different subdomains, e.g.
      #   API_BASE_URL=https://api-calyx.example.ts.net/api/v1
      API_BASE_URL: ${API_BASE_URL:-/api/v1}

      # Cross-origin isolation. OFF by default, and that default is deliberate.
      #
      # Turning it on lets Chromium use OPFS with locks (durable storage).
      # It also makes SharedWorkers unavailable in Firefox, which is the path
      # Firefox's storage backend needs -- so an isolated origin can leave
      # Firefox hanging on a database that never opens.
      #
      # off (default): works everywhere. Chromium falls back to IndexedDB,
      #                which persists but the browser may evict it.
      # on:            set COOP=same-origin and COEP=require-corp. Best
      #                durability on Chromium; expect Firefox to break.
      COOP_VALUE: ${COOP_VALUE:-unsafe-none}
      COEP_VALUE: ${COEP_VALUE:-unsafe-none}

      # Substitute ONLY these: nginx configs are full of $$uri and friends, and
      # envsubst would happily eat them all.
      NGINX_ENVSUBST_FILTER: (API_BASE_URL|COOP_VALUE|COEP_VALUE)
    volumes:
      - web_bundle:/srv:ro
    configs:
      - source: nginx_site
        target: /etc/nginx/templates/default.conf.template
    depends_on:
      web-bundle:
        condition: service_completed_successfully

configs:
  nginx_site:
    content: |
      server {
          listen 80;
          server_name _;
          root /srv/current;
          index index.html;
          absolute_redirect off;

          # nginx's add_header does NOT merge across levels: any add_header in a
          # location REPLACES everything inherited from the server block. So the
          # isolation headers are repeated in every location that sets a header
          # of its own. Dropping them would silently downgrade browser storage.

          add_header Cross-Origin-Opener-Policy "${COOP_VALUE}" always;
          add_header Cross-Origin-Embedder-Policy "${COEP_VALUE}" always;
          add_header Cross-Origin-Resource-Policy "same-origin" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header Referrer-Policy "no-referrer" always;

          gzip on;
          gzip_types text/css application/javascript application/json image/svg+xml;

          # The entry point and service worker must never be cached, or the app
          # pins itself to a stale build and no amount of reloading helps.
          location ~ ^/(index\.html|flutter_service_worker\.js|version\.json)$ {
              add_header Cross-Origin-Opener-Policy "${COOP_VALUE}" always;
              add_header Cross-Origin-Embedder-Policy "${COEP_VALUE}" always;
              add_header Cross-Origin-Resource-Policy "same-origin" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Cache-Control "no-cache, must-revalidate" always;
          }

          location ~ \.wasm$ {
              types { application/wasm wasm; }
              default_type application/wasm;
              add_header Cross-Origin-Opener-Policy "${COOP_VALUE}" always;
              add_header Cross-Origin-Embedder-Policy "${COEP_VALUE}" always;
              add_header Cross-Origin-Resource-Policy "same-origin" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Cache-Control "public, max-age=31536000, immutable" always;
          }

          location ~ ^/(assets|canvaskit)/ {
              add_header Cross-Origin-Opener-Policy "${COOP_VALUE}" always;
              add_header Cross-Origin-Embedder-Policy "${COEP_VALUE}" always;
              add_header Cross-Origin-Resource-Policy "same-origin" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Cache-Control "public, max-age=31536000, immutable" always;
          }

          # The app fetches this on boot to learn where the API lives, so the
          # address is deployment configuration and never a user setting.
          location = /config.json {
              default_type application/json;
              add_header Cache-Control "no-store" always;
              return 200 '{"apiBaseUrl":"${API_BASE_URL}"}';
          }

          location / {
              # $$ escapes Compose interpolation; nginx receives a single $.
              try_files $$uri $$uri/ /index.html;
          }
      }

volumes:
  pgdata:
  media:
  apistate:
  web_bundle:
