# Tool configuration only. Runtime dependencies live in requirements.txt and
# requirements-dev.txt, which are the single source of truth -- the backend is
# a deployed application, not a distributable package, so it is never pip-installed.

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
testpaths = ["apps"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
