name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Build API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tasks-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Single-arch on purpose. The home server is x86_64; building linux/arm64
      # under QEMU triples the build for an artifact nothing runs. If the server
      # is ever replaced with ARM, change this line -- don't add both.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
