name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tasks
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: tasks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tasks -d tasks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "false"
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend

      # Catches a model change committed without its migration -- which would
      # otherwise only surface when deploy.sh runs migrate on the server.
      - name: Assert no missing migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend

      - run: pytest --cov --cov-report=term-missing
        working-directory: backend

  # --- Flutter jobs ----------------------------------------------------------

  app-analyze:
    name: App analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos

      # drift, riverpod, freezed and go_router all generate code. Stale
      # generated output is a constant source of confusing local failures, so
      # assert the committed files match what build_runner produces.
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Assert generated code is current
        run: git diff --exit-code

  app-test:
    name: App tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage

  drift-pin-check:
    name: Drift pin check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # sqlite3.wasm and drift_worker.js are attached to the drift GitHub release
      # Dart package and must come from the same release. A caret range lets
      # `pub upgrade` desync them, which breaks web only, at runtime, with an
      # obscure error. Fail here instead.
      - name: Assert drift is pinned exactly
        run: |
          line=$(grep -E "^\s*drift:" app/pubspec.yaml || true)
          echo "found: $line"
          if [ -z "$line" ]; then echo "::error::drift not found in pubspec.yaml"; exit 1; fi
          if echo "$line" | grep -qE "[\^~>=<]"; then
            echo "::error::drift must be pinned to an exact version, got: $line"
            exit 1
          fi
      - name: Assert drift web assets are committed
        run: |
          missing=0
          for f in app/web/sqlite3.wasm app/web/drift_worker.js; do
            [ -f "$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit $missing

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A malformed workflow fails as a startup error with no jobs and no logs,
      # which is close to undebuggable from the Actions UI. Catch it in a job
      # that does produce logs.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
