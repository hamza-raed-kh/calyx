name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    # Signing secrets live in a gated environment. A tag push from a
    # compromised branch would otherwise get them; the environment's required
    # reviewer closes that. Fork PRs never receive secrets regardless.
    environment: release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/setup-flutter

      - name: Materialise signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Decoded outside the workspace so it can never be swept into an
          # artifact upload or a stray `git add`.
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOT
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOT

      - run: flutter pub get

      # split-per-abi keeps the arm64-v8a APK small; the universal build is the
      # fallback for anything unusual. No .aab -- this is sideloaded, never
      # going to Play, so an app bundle would be useless.
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release

      # A release APK that fell back to the debug key builds and installs
      # perfectly, then refuses to update over a properly signed one -- and
      # nothing in the build output says so. Fail loudly instead.
      - name: Refuse a debug-signed release
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk > /tmp/certs.txt
          cat /tmp/certs.txt
          if grep -qi 'CN=Android Debug' /tmp/certs.txt; then
            echo "::error::APK is debug-signed; key.properties was not picked up"
            exit 1
          fi

      - name: Scrub signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

  linux-bundle:
    name: Linux desktop bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # libstdc++-12-dev is the one that gets forgotten; without it the CMake
      # link step fails with an unhelpful error.
      - name: Install GTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package
        run: tar czf "tasks-linux-x64-${GITHUB_REF_NAME}.tar.gz" -C build/linux/x64/release bundle

      - uses: softprops/action-gh-release@v2
        with:
          files: app/tasks-linux-x64-*.tar.gz
          fail_on_unmatched_files: true
